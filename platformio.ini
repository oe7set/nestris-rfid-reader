; nestris-rfid-reader: firmware (esp32dev) and PC unit tests of src/core (native).

[platformio]
default_envs = esp32dev

[common]
lib_deps =
    bblanchon/ArduinoJson @ 7.4.2
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_unflags =
    -std=gnu++11

[env:esp32dev]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps =
    ${common.lib_deps}
    miguelbalboa/MFRC522 @ 1.4.12
    adafruit/Adafruit SSD1306 @ 2.5.15
    adafruit/Adafruit GFX Library @ 1.12.1
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=0
build_unflags = ${common.build_unflags}
extra_scripts =
    pre:tools/pio_version.py
    post:tools/pio_merge.py

[env:native]
; Unit tests of the pure logic in src/core on the PC: pio test -e native
; Needs gcc/g++ on PATH. On Windows without gcc: tools/native-zig (zig via uvx), see CLAUDE.md.
platform = native
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DUNIT_TEST_NATIVE
    -Isrc
build_src_filter = -<*> +<core/>
test_build_src = yes
extra_scripts = pre:tools/pio_version.py
